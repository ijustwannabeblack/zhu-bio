<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>larpifyy.asia</title>
    <link rel="icon" type="image/png" href="assets/website.png">
    <link rel="apple-touch-icon" href="assets/website.png">
    <meta property="og:title" content="larpifyy.asia">
    <meta property="og:description" content="anja my world • owner of /larpifyy">
    <meta property="og:image" content="assets/website.png">
    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="larpifyy.asia">
    <meta name="twitter:description" content="anja my world • owner of /larpifyy">
    <meta name="twitter:image" content="assets/website.png">
    <meta name="theme-color" content="#00ced1">
    <link rel="stylesheet" href="style.css">
</head>
<body class="home-theme" onload="initMedia()">
    
    <!-- Custom Cursor using assets/cursor.png -->
    <div class="custom-cursor"></div>

    <!-- Start Screen -->
    <div id="start-screen">
        <div id="start-text"></div>
    </div>

    <!-- Top Left Volume Control Widget -->
    <div id="volume-control-widget" class="volume-widget">
        <button id="volume-toggle-btn" class="volume-btn" title="Mute / Unmute">
            <svg id="volume-icon-high" class="vol-icon" viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
            <svg id="volume-icon-mute" class="vol-icon hidden" viewBox="0 0 24 24"><path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/></svg>
        </button>
        <div class="volume-slider-wrapper">
            <input type="range" id="volume-slider-bar" class="volume-slider" min="0" max="1" step="0.01" value="0.5" title="Volume Slider">
        </div>
    </div>

    <!-- Top Right Berlin Time Widget -->
    <div id="time-widget" class="time-widget" title="Local Time in Germany (Berlin)">
        <svg class="time-icon" viewBox="0 0 24 24"><path d="M12 2C6.5 2 2 6.5 2 12s4.5 10 10 10 10-4.5 10-10S17.5 2 12 2zm4.2 14.2L11 13V7h1.5v5.2l4.5 2.7-.8 1.3z"/></svg>
        <span class="time-tz-badge">BERLIN</span>
        <span id="berlin-time" class="time-clock">00:00:00</span>
    </div>

    <div class="container">
        
        <!-- Background Video & Canvas -->
        <video id="background" autoplay loop muted playsinline webkit-playsinline>
            <source src="assets/background.mp4" type="video/mp4">
        </video>
        <canvas id="ambient-canvas"></canvas>

        <div class="glitch-overlay"></div>
        <div id="hacker-overlay" class="hidden"></div>
        <div id="snow-overlay" class="hidden"></div>

        <!-- Profile Block -->
        <div id="profile-block">
            <!-- Discord Banner -->
            <div id="profile-banner" class="profile-banner">
                <img id="profile-banner-img" class="profile-banner-img" src="assets/banner.png" alt="Discord Banner">
            </div>

            <div class="profile-header">
                <div class="profile-container">
                    <img id="profile-picture" src="https://cdn.discordapp.com/avatars/1415022792214052915/bb119705c758a4b9ca4da082aed862e7.png?size=512" alt="Profile" class="profile-picture">
                    <img id="avatar-decoration" class="avatar-decor hidden" src="" alt="Avatar Decoration">
                    <div id="status-dot" class="status-dot dnd" title="Do Not Disturb">
                        <img id="status-icon-img" src="discord/dnd.png" alt="Status" class="status-icon-img">
                    </div>
                </div>
                <div class="profile-info">
                    <div class="name-and-badges">
                        <div class="name-tag-wrapper">
                            <span id="profile-name">zhu</span>
                            <span id="clan-tag" class="clan-tag-badge">
                                <img id="clan-badge-icon" src="https://cdn.discordapp.com/clan-badges/1539326595880325124/5607047f21b7e25a26c195cc49871278.png?size=64" alt="" class="clan-icon">
                                <span id="clan-tag-name">AI</span>
                            </span>
                            <span class="pronoun-tag">he/him</span>
                        </div>
                        <div class="badge-box">
                            <div class="badge-box-inner">
                                <div class="badge-group" id="badge-group">
                                    <!-- Only badges from badges/ folder rendered dynamically -->
                                </div>
                            </div>
                        </div>
                    </div>
                    <div id="profile-bio"></div>
                </div>
            </div>

            <div class="bio-separator"></div>

            <div class="profile-footer">
                <div class="social-links">
                    <a href="https://discord.gg/larpifyy" target="_blank" class="social-link" title="Discord">
                        <svg class="social-icon" viewBox="0 0 24 24"><path d="M20.317 4.37a19.791 19.791 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.617-1.25.077.077 0 0 0-.079-.037A19.736 19.736 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.057a.082.082 0 0 0 .031.057 19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028c.462-.63.874-1.295 1.226-1.994.021-.041.001-.09-.041-.106a13.107 13.107 0 0 1-1.872-.892.077.077 0 0 1-.008-.128 10.2 10.2 0 0 0 .372-.292.074.074 0 0 1 .077-.01c3.929 1.793 8.18 1.793 12.061 0a.074.074 0 0 1 .078.01c.12.098.246.198.373.292a.077.077 0 0 1-.006.127 12.299 12.299 0 0 1-1.873.893.077.077 0 0 0-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028 19.839 19.839 0 0 0 6.002-3.03.077.077 0 0 0 .032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 0 0-.031-.028zM8.02 15.33c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.956-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.956 2.418-2.157 2.418zm7.975 0c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.955-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.946 2.418-2.157 2.418z"/></svg>
                    </a>
                </div>
                <div class="view-counter" title="Views">
                    <svg class="view-icon" viewBox="0 0 24 24">
                        <path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/>
                    </svg>
                    <span id="visitor-count">1</span>
                </div>
            </div>
        </div>
    </div>

    <!-- Minimalist Spotify Widget -->
    <div id="spotify-player" class="spotify-dock hidden">
        <div class="spotify-dock-art">
            <img id="spotify-art" src="" alt="Album Art">
        </div>
        <div class="spotify-dock-info">
            <div class="spotify-dock-top">
                <a id="spotify-song" class="spotify-dock-title" href="#" target="_blank">Song Title</a>
                <svg class="spotify-dock-logo" viewBox="0 0 24 24"><path d="M12 0C5.4 0 0 5.4 0 12s5.4 12 12 12 12-5.4 12-12S18.66 0 12 0zm5.521 17.34c-.24.359-.66.48-1.021.24-2.82-1.74-6.36-2.101-10.561-1.141-.418.122-.779-.179-.899-.539-.12-.421.18-.78.54-.9 4.56-1.021 8.52-.6 11.64 1.32.42.18.479.659.301 1.02zm1.44-3.3c-.301.42-.841.6-1.262.3-3.239-1.98-8.159-2.58-11.939-1.38-.479.12-1.02-.12-1.14-.6-.12-.48.12-1.021.6-1.141C9.6 9.9 15 10.561 18.72 12.84c.361.181.54.78.241 1.2zm.12-3.36C15.24 8.4 8.82 8.16 5.16 9.301c-.6.179-1.2-.181-1.38-.721-.18-.601.18-1.2.72-1.381 4.26-1.26 11.28-1.02 15.721 1.621.539.3.719 1.02.419 1.56-.299.421-1.02.599-1.559.3z"/></svg>
            </div>
            <span id="spotify-artist" class="spotify-dock-artist">Artist • Album</span>
            <div class="spotify-dock-bar-wrap">
                <div class="spotify-dock-bar">
                    <div id="spotify-bar-fill" class="spotify-dock-bar-fill"></div>
                </div>
                <div class="spotify-dock-time">
                    <span id="spotify-time-cur">0:00</span> / <span id="spotify-time-dur">0:00</span>
                </div>
            </div>
        </div>
    </div>



    <!-- Theme Audios -->
    <audio id="background-music" loop>
        <source src="assets/background_music.mp3" type="audio/mp3">
    </audio>
    <audio id="hacker-music" loop muted>
        <source src="assets/hacker_music.mp3" type="audio/mp3">
    </audio>
    <audio id="rain-music" loop muted>
        <source src="assets/rain_music.mp3" type="audio/mp3">
    </audio>
    <audio id="anime-music" loop muted>
        <source src="assets/anime_music.mp3" type="audio/mp3">
    </audio>
    <audio id="car-music" loop muted>
        <source src="assets/car_music.mp3" type="audio/mp3">
    </audio>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
